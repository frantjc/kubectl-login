name: CI
on:
  workflow_dispatch: {}
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: dagger
      - run: dagger check
      - name: Export kubectl-login
        run: dagger call binary export --path ${{ runner.temp }}/kubectl-login
      - name: Exec kubectl-login
        run: ${{ runner.temp }}/kubectl-login --audience frantj.cc
